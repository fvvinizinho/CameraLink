<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosto Cam</title>
<style>
  html, body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; }
  #wrap { position:fixed; inset:0; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; transform-origin:center; display:block; }
  #paused { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:#101216; color:#e8eaee; font:600 clamp(20px,6vw,64px) system-ui,sans-serif; text-align:center; padding:20px; }
  #paused.on { display:flex; }
</style>
</head>
<body>
<div id="wrap"><video id="v" autoplay playsinline></video></div>
<div id="paused">TELA PAUSADA</div>
<script src="/view.js"></script>
</body>
</html>
